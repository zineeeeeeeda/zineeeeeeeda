name: Update liquidity monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python update_liquidity.py

      - name: Commit refreshed data
        run: |
          git config user.name "liquidity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history.csv
          git diff --cached --quiet || git commit -m "Auto-update liquidity data"
          git push
